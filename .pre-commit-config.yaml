# Pre-commit hooks for this repository.
#
#   pip install pre-commit      # or: pip install -r requirements-dev.txt
#   pre-commit install          # enable hooks on every `git commit`
#   pre-commit run --all-files  # run once over the whole repo
#   pre-commit autoupdate       # bump the hook versions below to the latest
#
# Ruff and isort settings live in pyproject.toml.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (sort imports)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix"]
      - id: ruff-format
        name: ruff (format)
